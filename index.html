<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Bondhu - Bangladeshi Chat & Calls</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2e88ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bondhu">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/index.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        #root {
            height: 100%;
            height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: stretch;
            overflow: hidden;
        }
        .imo-blue { background-color: #2e88ff; }
        .imo-blue-text { color: #2e88ff; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="bg-gray-100 h-full overflow-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  // Service Worker Registration for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Bondhu PWA Service Worker Registered:', reg.scope))
        .catch((err) => console.warn('SW registration failed:', err));
    });
  }

  // PWA Install Prompt Handler
  window.deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.deferredInstallPrompt = e;
    try {
      localStorage.removeItem('BONDHU_APP_INSTALLED_FLAG_V1');
      localStorage.removeItem('BONDHU_INSTALLED_KEY');
    } catch (_) {}
    window.dispatchEvent(new CustomEvent('pwa-can-install'));
    window.dispatchEvent(new CustomEvent('bondhu-app-can-install'));
  });

  window.addEventListener('appinstalled', () => {
    window.deferredInstallPrompt = null;
    try {
      localStorage.setItem('BONDHU_APP_INSTALLED_FLAG_V1', 'true');
    } catch (_) {}
    window.dispatchEvent(new CustomEvent('bondhu-app-installed'));
    console.log('Bondhu App was installed successfully!');
  });

  // Automatically check if PWA was uninstalled/deleted
  if (typeof navigator !== 'undefined' && 'getInstalledRelatedApps' in navigator) {
    navigator.getInstalledRelatedApps().then(function(apps) {
      if (Array.isArray(apps) && apps.length === 0) {
        try {
          localStorage.removeItem('BONDHU_APP_INSTALLED_FLAG_V1');
          localStorage.removeItem('BONDHU_INSTALLED_KEY');
        } catch (_) {}
        window.dispatchEvent(new CustomEvent('bondhu-app-can-install'));
      }
    }).catch(function() {});
  }
</script>
</body>
</html>
